<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- Cabeza de gato -->
  <circle cx="50" cy="55" r="25" fill="#888888" stroke="#1f1f1f" stroke-width="2"/>

  <!-- Orejas -->
  <polygon points="30,38 38,15 46,38" fill="#888888" stroke="#1f1f1f" stroke-width="2"/>
  <polygon points="54,38 62,15 70,38" fill="#888888" stroke="#1f1f1f" stroke-width="2"/>

  <!-- Ojos -->
  <circle cx="42" cy="50" r="3" fill="#000000"/>
  <circle cx="58" cy="50" r="3" fill="#000000"/>

  <!-- Nariz -->
  <polygon points="50,57 48,60 52,60" fill="#ff6699"/>

  <!-- Bigotes izquierdos -->
  <line x1="20" y1="52" x2="40" y2="55" stroke="black" stroke-width="1.5"/>
  <line x1="20" y1="58" x2="40" y2="58" stroke="black" stroke-width="1.5"/>
  <line x1="20" y1="64" x2="40" y2="61" stroke="black" stroke-width="1.5"/>

  <!-- Bigotes derechos -->
  <line x1="60" y1="55" x2="80" y2="52" stroke="black" stroke-width="1.5"/>
  <line x1="60" y1="58" x2="80" y2="58" stroke="black" stroke-width="1.5"/>
  <line x1="60" y1="61" x2="80" y2="64" stroke="black" stroke-width="1.5"/>

  <!-- Signo delta -->
  <text x="130" y="72" font-family="serif" font-size="60" text-anchor="middle" fill="black">Δ</text>
</svg>